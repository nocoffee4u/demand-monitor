# ---------------------------------------------------------------------------
# Reddit communities to scan. Add any others relevant to your niche.
# Verify these subreddit names still exist/are active before your first run —
# subreddit names and activity levels drift over time.
# ---------------------------------------------------------------------------
subreddits:
  - RadPowerBikes
  - ebikes
  - electricbikes
  - MTB
  - mountainbiking
  - bikewrench
  - functionalprint
  - 3Dprinting
  - fpv
  - Multicopter
  - diydrones
  - MechanicAdvice
  - cartalk
  - UTV
  - atvs
  - side_by_side

# Lookback window for Reddit search, in days
reddit_lookback_days: 180

# ---------------------------------------------------------------------------
# Google Ads search volume via DataForSEO (primary demand signal).
# Credentials: DATAFORSEO_LOGIN / DATAFORSEO_PASSWORD in .env
# queue: standard (cheaper, async poll) | live (faster, higher cost)
# cache_ttl_days: skip re-querying keywords fresher than this
# Optional per-product: search_volume_keywords (else uses keywords)
# ---------------------------------------------------------------------------
search_volume:
  enabled: true
  location_code: 2840          # United States
  language_code: en
  queue: standard              # standard | live
  cache_ttl_days: 7
  cache_path: cache/search_volume_cache.json
  poll_interval_s: 15
  poll_timeout_s: 3600
  search_partners: false
  # cost_* used only by --estimate (update if DataForSEO changes pricing)
  cost_standard: 0.05
  cost_live: 0.075

# ---------------------------------------------------------------------------
# X (Twitter) signal — optional, pay-per-use API (see x_scan.py / README).
# brand_accounts: handles to fold into category-matched product queries
# brand_categories: only those product categories get brand-scoped queries
# max_results: keep low (API min 10) to bound weekly Post-read cost
# ---------------------------------------------------------------------------
x:
  enabled: true
  lookback_days: 7
  max_results: 10
  brand_accounts:
    - RadPowerBikes
  brand_categories:
    - rad_power_bikes

# Marketplace competition sources.
# Each entry needs a `name` (CSV column prefix) and an `adapter` that
# marketplace_scan.py knows how to talk to:
#   printables | cults | thangs | makerworld | html (generic CSS scrape)
# Set enabled: false to skip without deleting the block.
#
# makerworld: HTML is Cloudflare-gated; unauthenticated JSON search does not
# filter by keyword (empty or global hot-list). Left disabled so it doesn't
# flood the report with ERR — re-enable to re-probe after API behavior changes.
marketplaces:
  - name: printables
    adapter: printables
  - name: cults
    adapter: cults
  # Thangs is often client-rendered / 403 for bots; enable only if it starts
  # returning stable totals again.
  - name: thangs
    adapter: thangs
    enabled: false
  - name: makerworld
    adapter: makerworld
    enabled: false

# ---------------------------------------------------------------------------
# Manual-check community sources.
# These are NOT scraped by any script in this tool. They're listed here so
# every source you're tracking demand across lives in one config file, even
# the ones that stay a human task.
#
# Facebook Groups: excluded on purpose — Meta's ToS prohibits scraping and
# its anti-automation measures make it unreliable even before the compliance
# question.
#
# Pinkbike Forum and MTBR Forum: tested directly (July 2026) and both run
# JS/session-gated search (no plain keyword-in-URL results page an
# unauthenticated script can fetch), the same practical problem as Facebook.
# A future upgrade path if this becomes worth automating: both forums are
# Google-indexed, so a paid SERP API (e.g. `site:pinkbike.com/forum
# <keyword>`) could substitute for the manual check without touching the
# forums' own search directly.
#
# Log all manual checks in facebook_manual_log.csv (now covers all three
# manual sources, not just Facebook — kept the filename so existing weekly
# habits/links don't break) on the same weekly cadence as the automated scan.
#
# X: automated via x_scan.py when X_BEARER_TOKEN is set; otherwise log in
# x_manual_log.csv (same weekly cadence).
# ---------------------------------------------------------------------------
manual_check_sources:
  - name: "Facebook Groups"
    examples: ["Rad Power Bikes Owners", "regional MTB/e-bike groups"]
    note: "ToS prohibits scraping; 5-min weekly manual keyword check"
  - name: "Pinkbike Forum"
    url: "https://www.pinkbike.com/forum/"
    note: "Use the on-page 'Search Forum' box per product keyword; JS/session-gated, not scriptable"
  - name: "MTBR Forum"
    url: "https://www.mtbr.com/search/?type=post"
    note: "Advanced search page; XenForo search requires a live session, not scriptable"
  - name: "X / Twitter"
    url: "https://x.com/RadPowerBikes"
    note: "Prefer x_scan.py with X_BEARER_TOKEN; else fill x_manual_log.csv weekly"
