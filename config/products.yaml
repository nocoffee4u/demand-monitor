# ---------------------------------------------------------------------------
# Candidate product list for demand scanning.
# Add/remove products freely. Each product needs:
#   name                   - human readable label
#   keywords               - discovery terms (Reddit, Trends, X fallback)
#   search_volume_keywords - broader phrases people actually type in Google
#                            (used by search_volume_scan.py / DataForSEO)
#   marketplace_keywords   - tighter competition queries (optional)
#   x_keywords             - optional tighter X search phrases
#   youtube_keywords       - optional YouTube search phrases (else keywords)
#   category               - "rad_power_bikes", "mtb_general", etc.
#   fit:                   - optional overrides for manufacturing-fit score
#                            (0–100 each; omit to use rule-based defaults)
#     fdm_fit              - works on Bambu FDM (P1S+AMS)?
#     material_fit         - PLA/PETG/PETG-CF/Nylon-CF friendly?
#     customer_clarity     - obvious buyer + use case?
#     support_burden       - high = low support (simple/robust)
# ---------------------------------------------------------------------------

